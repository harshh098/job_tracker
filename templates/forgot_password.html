<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — JobTracker AI</title>
  <link rel="stylesheet" href="/static/css/main.css"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>"/>
  <style>
    .auth-layout {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 1;
    }
    .auth-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4), var(--shadow-glow-purple);
      animation: fadeUp 0.4s ease forwards;
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .auth-logo-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 24px rgba(139,92,246,0.5);
    }
    .auth-logo-text {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, var(--neon-purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .auth-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .auth-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 28px;
    }
    .auth-error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      color: #FCA5A5;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .auth-success {
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.3);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      color: #86EFAC;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .auth-footer a { color: var(--neon-purple); text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
    .btn-full { width: 100%; justify-content: center; padding: 11px; font-size: 14px; }

    /* Step indicators */
    .step-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .step-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.3s, transform 0.3s;
    }
    .step-dot.active {
      background: var(--neon-purple);
      transform: scale(1.25);
      box-shadow: 0 0 8px rgba(139,92,246,0.6);
    }
    .step-dot.done { background: #22c55e; }
    .step-label { font-size: 12px; color: var(--text-muted); }

    /* OTP timer */
    #fp-otp-timer { font-size: 12px; color: var(--text-muted); margin-top: 4px; min-height: 18px; }

    /* Password strength */
    .pw-strength-bar {
      height: 3px;
      border-radius: 2px;
      background: var(--border);
      margin-top: 6px;
      overflow: hidden;
    }
    .pw-strength-fill {
      height: 100%;
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s, background 0.3s;
    }
    .pw-strength-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      min-height: 16px;
    }

    /* Step panels */
    .fp-step { display: none; }
    .fp-step.active { display: block; }
  </style>
</head>
<body>
<div class="auth-layout">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="auth-logo-icon">🎯</div>
      <span class="auth-logo-text">JobTracker AI</span>
    </div>

    <div class="auth-title">Reset your password</div>
    <div class="auth-subtitle" id="fp-subtitle">Enter your phone number to receive a reset code.</div>

    <!-- Step indicator -->
    <div class="step-indicator">
      <div class="step-dot active" id="dot-1"></div>
      <div class="step-dot"        id="dot-2"></div>
      <div class="step-dot"        id="dot-3"></div>
      <span class="step-label" id="step-label-text">Step 1 of 3</span>
    </div>

    <div class="auth-error"   id="fp-error"></div>
    <div class="auth-success" id="fp-success"></div>

    <!-- ── Step 1: Phone number ── -->
    <div class="fp-step active" id="fp-step-1">
      <div class="form-group">
        <label class="form-label">Phone number</label>
        <input class="form-input" id="fp-phone" type="tel"
               placeholder="+91XXXXXXXXXX" autocomplete="tel"/>
      </div>
      <button class="btn btn-primary btn-full" id="send-otp-btn" onclick="doFpSendOtp()">
        Send Verification Code
      </button>
    </div>

    <!-- ── Step 2: Verify OTP ── -->
    <div class="fp-step" id="fp-step-2">
      <div class="form-group">
        <label class="form-label">Verification code</label>
        <input class="form-input" id="fp-otp" type="text" maxlength="6"
               placeholder="Enter 6-digit code" inputmode="numeric" autocomplete="one-time-code"/>
        <div id="fp-otp-timer"></div>
      </div>
      <button class="btn btn-primary btn-full" id="verify-otp-btn" onclick="doFpVerifyOtp()">
        Verify Code
      </button>
      <p style="text-align:center;margin-top:12px;font-size:13px;color:var(--text-muted)">
        Didn't get it? <a href="#" onclick="goToStep1();return false;">Resend</a>
      </p>
    </div>

    <!-- ── Step 3: New password ── -->
    <div class="fp-step" id="fp-step-3">
      <div class="form-group">
        <label class="form-label">New password</label>
        <input class="form-input" id="fp-new-password" type="password"
               placeholder="At least 6 characters" autocomplete="new-password"
               oninput="updatePwStrength(this.value)"/>
        <div class="pw-strength-bar"><div class="pw-strength-fill" id="pw-fill"></div></div>
        <div class="pw-strength-label" id="pw-label"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm new password</label>
        <input class="form-input" id="fp-confirm-password" type="password"
               placeholder="••••••••" autocomplete="new-password"/>
      </div>
      <button class="btn btn-primary btn-full" id="reset-btn" onclick="doResetPassword()">
        Set New Password
      </button>
    </div>

    <div class="auth-footer">
      Remember it? <a href="/auth/login">Back to Sign In</a>
    </div>

  </div>
</div>

<div id="toast-container"></div>
<script src="/static/js/utils.js"></script>
<script>
  let otpTimerInterval = null;

  // ── Step management ────────────────────────────────────────────
  const subtitles = [
    'Enter your phone number to receive a reset code.',
    'Enter the 6-digit code we sent via SMS.',
    'Choose a strong new password.'
  ];

  function goToStep(n) {
    [1, 2, 3].forEach(i => {
      document.getElementById(`fp-step-${i}`).classList.toggle('active', i === n);
      const dot = document.getElementById(`dot-${i}`);
      dot.classList.toggle('active', i === n);
      dot.classList.toggle('done',   i < n);
    });
    document.getElementById('step-label-text').textContent = `Step ${n} of 3`;
    document.getElementById('fp-subtitle').textContent     = subtitles[n - 1];
    clearMessages();
  }

  function goToStep1() {
    clearInterval(otpTimerInterval);
    document.getElementById('fp-otp-timer').textContent = '';
    document.getElementById('fp-otp').value = '';
    const btn = document.getElementById('send-otp-btn');
    btn.disabled    = false;
    btn.textContent = 'Send Verification Code';
    goToStep(1);
  }

  // ── Messages ───────────────────────────────────────────────────
  function showError(msg) {
    const el = document.getElementById('fp-error');
    el.textContent   = msg;
    el.style.display = 'block';
    document.getElementById('fp-success').style.display = 'none';
  }
  function showSuccess(msg) {
    const el = document.getElementById('fp-success');
    el.textContent   = msg;
    el.style.display = 'block';
    document.getElementById('fp-error').style.display = 'none';
  }
  function clearMessages() {
    document.getElementById('fp-error').style.display   = 'none';
    document.getElementById('fp-success').style.display = 'none';
  }

  // ── OTP countdown timer ────────────────────────────────────────
  function startTimer(seconds) {
    const el = document.getElementById('fp-otp-timer');
    clearInterval(otpTimerInterval);
    let remaining = seconds;
    const tick = () => {
      const m = String(Math.floor(remaining / 60)).padStart(2, '0');
      const s = String(remaining % 60).padStart(2, '0');
      el.textContent = `Code expires in ${m}:${s}`;
      if (remaining <= 0) {
        clearInterval(otpTimerInterval);
        el.textContent = 'Code expired. Please resend.';
      }
      remaining--;
    };
    tick();
    otpTimerInterval = setInterval(tick, 1000);
  }

  // ── Password strength ──────────────────────────────────────────
  function updatePwStrength(val) {
    const fill  = document.getElementById('pw-fill');
    const label = document.getElementById('pw-label');
    if (!val) { fill.style.width = '0%'; label.textContent = ''; return; }
    let score = 0;
    if (val.length >= 6)           score++;
    if (val.length >= 10)          score++;
    if (/[A-Z]/.test(val))         score++;
    if (/[0-9]/.test(val))         score++;
    if (/[^A-Za-z0-9]/.test(val))  score++;
    const levels = [
      { w: '20%',  bg: '#ef4444', text: 'Too weak'    },
      { w: '40%',  bg: '#f97316', text: 'Weak'        },
      { w: '60%',  bg: '#eab308', text: 'Fair'        },
      { w: '80%',  bg: '#22c55e', text: 'Strong'      },
      { w: '100%', bg: '#10b981', text: 'Very strong' },
    ];
    const lvl = levels[Math.min(score - 1, 4)] || levels[0];
    fill.style.width      = lvl.w;
    fill.style.background = lvl.bg;
    label.textContent     = lvl.text;
    label.style.color     = lvl.bg;
  }

  // ── Step 1: Send OTP ───────────────────────────────────────────
  async function doFpSendOtp() {
    const phone = document.getElementById('fp-phone').value.trim();
    const btn   = document.getElementById('send-otp-btn');
    clearMessages();

    if (!phone) {
      showError('Please enter your phone number.');
      return;
    }
    if (!phone.startsWith('+')) {
      showError('Phone must be in E.164 format (e.g. +91XXXXXXXXXX).');
      return;
    }

    btn.disabled  = true;
    btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px"></span> Sending…';

    try {
      const res  = await fetch('/auth/forgot-password/send-otp', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ phone })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to send code.');

      showSuccess('Verification code sent via SMS.');
      goToStep(2);
      startTimer(300);
    } catch (e) {
      showError(e.message);
      btn.disabled    = false;
      btn.textContent = 'Send Verification Code';
    }
  }

  // ── Step 2: Verify OTP ─────────────────────────────────────────
  async function doFpVerifyOtp() {
    const phone = document.getElementById('fp-phone').value.trim();
    const otp   = document.getElementById('fp-otp').value.trim();
    const btn   = document.getElementById('verify-otp-btn');
    clearMessages();

    if (!otp || otp.length !== 6) {
      showError('Please enter the 6-digit code.');
      return;
    }

    btn.disabled  = true;
    btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px"></span> Verifying…';

    try {
      const res  = await fetch('/auth/forgot-password/verify', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ phone, otp })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Verification failed.');

      clearInterval(otpTimerInterval);
      goToStep(3);
    } catch (e) {
      showError(e.message);
      btn.disabled    = false;
      btn.textContent = 'Verify Code';
    }
  }

  // ── Step 3: Reset password ─────────────────────────────────────
  async function doResetPassword() {
    const phone     = document.getElementById('fp-phone').value.trim();
    const newPw     = document.getElementById('fp-new-password').value;
    const confirmPw = document.getElementById('fp-confirm-password').value;
    const btn       = document.getElementById('reset-btn');
    clearMessages();

    if (!newPw || newPw.length < 6) {
      showError('Password must be at least 6 characters.');
      return;
    }
    if (newPw !== confirmPw) {
      showError('Passwords do not match.');
      return;
    }

    btn.disabled  = true;
    btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px"></span> Updating…';

    try {
      const res  = await fetch('/auth/forgot-password/reset', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ phone, new_password: newPw })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Reset failed.');

      showSuccess('Password updated! Redirecting to sign in…');
      setTimeout(() => { window.location.href = '/auth/login'; }, 1800);
    } catch (e) {
      showError(e.message);
      btn.disabled    = false;
      btn.textContent = 'Set New Password';
    }
  }

  // ── Enter key support ──────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const active = document.querySelector('.fp-step.active').id;
    if      (active === 'fp-step-1') doFpSendOtp();
    else if (active === 'fp-step-2') doFpVerifyOtp();
    else if (active === 'fp-step-3') doResetPassword();
  });
</script>
</body>
</html>
